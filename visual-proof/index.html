<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewAtlas Visual Proof — Phase 2</title>
  <style>
    body { margin: 0; background: #1a1410; color: #fdfbf7; font-family: system-ui, sans-serif; }
    header { padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,.08); }
    h1 { font-weight: 500; margin: 0 0 8px; }
    p { margin: 0; color: rgba(232,220,200,.7); font-size: 14px; }
    section { padding: 24px 32px 48px; }
    h2 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
    .grid { display: grid; gap: 32px; grid-template-columns: 1fr; }
    @media (min-width: 1200px) { .grid { grid-template-columns: 1fr 1fr; } }
    img { width: 100%; display: block; border: 1px solid rgba(255,255,255,.08); border-radius: 4px; }
    figcaption { margin-top: 8px; font-size: 13px; color: rgba(232,220,200,.55); }
  </style>
</head>
<body>
  <header>
    <h1>BrewAtlas Visual Proof</h1>
    <p>Phase 2 — Recipes Archive · 1440×900 full-page captures</p>
  </header>
  <section>
    <h2>Recipes — Before / After</h2>
    <div class="grid">
      <figure>
        <img src="02-recipes-before-phase2.png" alt="Recipes before Phase 2" />
        <figcaption>Before — card grid + filter chips</figcaption>
      </figure>
      <figure>
        <img src="02-recipes-phase2-after.png" alt="Recipes after Phase 2" />
        <figcaption>After — cover + folio + method index + invitation</figcaption>
      </figure>
    </div>
  </section>
  <section>
    <h2>Recipes — Full page (Phase 2)</h2>
    <img src="02-recipes-phase2-after.png" alt="Recipes archive full page" />
  </section>
  <section>
    <h2>Homepage — Spacing refinement (Phase 2)</h2>
    <img src="01-homepage-phase2-spacing.png" alt="Homepage with tighter chapter spacing" />
  </section>
</body>
</html>
